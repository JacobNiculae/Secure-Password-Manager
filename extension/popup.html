<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            width: 280px;
            padding: 16px;
            background: #1e1e2e;
            color: #cdd6f4;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
        }
        h2 {
            font-size: 15px;
            margin: 0 0 8px 0;
            color: #cdd6f4;
        }
        p {
            font-size: 12px;
            color: #a6adc8;
            margin: 0 0 12px 0;
        }
        button {
            width: 100%;
            background: #7c6af7;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        button:hover {
            background: #9580ff;
        }
        #status {
            margin-top: 10px;
            font-size: 12px;
            text-align: center;
            color: #a6adc8;
        }
    </style>
</head>
<body>
    <h2>🔐 Secure Password Manager</h2>
    <p>Connected to your local vault.</p>
    <button id="checkBtn">Check Vault Status</button>
    <div id="status"></div>

    <script>
        document.getElementById('checkBtn').addEventListener('click', () => {
            fetch('http://127.0.0.1:5000/status')
                .then(res => res.json())
                .then(data => {
                    const status = document.getElementById('status');
                    if (data.locked) {
                        status.style.color = '#f38ba8';
                        status.textContent = '🔒 Vault is locked. Open the app to unlock.';
                    } else {
                        status.style.color = '#a6e3a1';
                        status.textContent = '✅ Vault is unlocked and ready.';
                    }
                })
                .catch(() => {
                    document.getElementById('status').textContent = '❌ App is not running.';
                    document.getElementById('status').style.color = '#f38ba8';
                });
        });
    </script>
</body>
</html>
